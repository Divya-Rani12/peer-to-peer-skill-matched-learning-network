<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign Up </title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="form-page">
    <div class="form-box">
      <h2>Create Account</h2>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-wrap">
            {% for category, msg in messages %}
              <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('signup') }}" method="POST" onsubmit="return validateCaptcha()">
        <input type="text" name="first_name" placeholder="First name" required>
        <input type="text" name="last_name" placeholder="Last name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" name="phone" placeholder="Phone number" required>
        <input type="password" name="password" placeholder="Password" required>

        <div class="captcha-row">
          <span id="captcha" class="captcha-box"></span>
          <input type="hidden" name="captcha_hidden" id="captcha_hidden">
          <input type="text" name="captcha_input" id="captcha_input" placeholder="Enter captcha" required>
        </div>

        <button type="submit" class="btn">Sign Up</button>
      </form>

      <p class="muted">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
      <p class="muted"><a href="{{ url_for('index') }}">&larr; Back to Home</a></p>
    </div>
  </div>

  <script>
    // generate captcha and set hidden field
    function generateCaptcha() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let txt = "";
      for (let i = 0; i < 5; i++) {
        txt += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('captcha').innerText = txt;
      document.getElementById('captcha_hidden').value = txt;
    }
    function validateCaptcha() {
      const user = document.getElementById('captcha_input').value.trim().toUpperCase();
      const real = document.getElementById('captcha_hidden').value.trim().toUpperCase();
      if (user !== real) {
        alert("Incorrect CAPTCHA. Please try again.");
        generateCaptcha();
        return false;
      }
      return true;
    }
    generateCaptcha();
  </script>
</body>
</html>
