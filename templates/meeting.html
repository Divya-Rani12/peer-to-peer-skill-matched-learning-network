<!doctype html>
<html>
<head>
  <title>Live Study Session</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://meet.jit.si/external_api.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }

    #jitsi-container {
      width: 100%;
      height: 500px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #controls button {
      margin: 5px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    #notes {
      width: 100%;
      height: 200px;
    }

    #feedback-section { margin-top: 20px; }
  </style>
</head>

<body>

<h2>📚 Live Study Session</h2>
<p>Session ID: {{ session_id }}</p>
<h3>Room: {{ room_id }}</h3>

<p id="timer">Time: 0 sec</p>

<!-- JITSI VIDEO -->
<div id="jitsi-container"></div>

<!-- NOTES -->
<h3>📝 Shared Notes</h3>
<textarea id="notes"></textarea>

<hr>

<!-- FEEDBACK (hidden until call ends) -->
<div id="feedback-section" style="display:none;">
  <h3>📋 Session Feedback</h3>
  <form method="POST" action="/submit-feedback">
    <input type="hidden" name="session_id" value="{{ session_id }}">
    <input type="hidden" name="to_email" value="{{ to_email }}">

    <select name="rating" required>
      <option value="">Rating</option>
      <option value="1">1 ⭐</option>
      <option value="2">2 ⭐</option>
      <option value="3">3 ⭐</option>
      <option value="4">4 ⭐</option>
      <option value="5">5 ⭐</option>
    </select>

    <br><br>
    <textarea name="comment" placeholder="Write feedback..." required></textarea>
    <br><br>
    <button type="submit">Submit Feedback</button>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const socket = io(window.location.origin);
  const room = "{{ room_id }}";
  const notes = document.getElementById("notes");

  // ── JITSI SETUP ──────────────────────────────────────────
  const api = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: "skillnet-" + room,
    parentNode: document.getElementById("jitsi-container"),
    width: "100%",
    height: 500,
    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: false,
      disableDeepLinking: true,
      prejoinPageEnabled: false,
      enableLobbyChat: false,
      lobbyModeEnabled: false
    },
    interfaceConfigOverwrite: {
      SHOW_JITSI_WATERMARK: false,
      TOOLBAR_BUTTONS: [
        'microphone', 'camera', 'fullscreen',
        'fodeviceselection', 'hangup', 'chat', 'tileview'
      ],
      HIDE_INVITE_MORE_HEADER: true
    }
});   // ✅ closes the options object AND the function call

  // ── TIMER ────────────────────────────────────────────────
  let seconds = 0;
  let timerInterval = null;

  api.addEventListener("videoConferenceJoined", () => {
    console.log("Joined Jitsi conference");
    timerInterval = setInterval(() => {
      seconds++;
      document.getElementById("timer").innerText = "Time: " + seconds + " sec";
    }, 1000);
  });

  // ── SHOW FEEDBACK WHEN CALL ENDS ─────────────────────────
  api.addEventListener("readyToClose", () => {
    clearInterval(timerInterval);
    api.dispose();
    document.getElementById("jitsi-container").style.display = "none";
    document.getElementById("feedback-section").style.display = "block";
  });

  // ── SHARED NOTES (your existing SocketIO logic) ───────────
  socket.emit("join", { room });

  notes.addEventListener("input", () => {
    socket.emit("notes-update", { room, content: notes.value });
  });

  socket.on("notes-update", data => {
    notes.value = data.content;
  });

});
</script>

</body>
</html>
